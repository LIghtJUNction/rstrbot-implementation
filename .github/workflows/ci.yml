name: RstrBot verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: python3 scripts/generate_openapi.py --check
      - run: python3 scripts/validate_openapi.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  database-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        valkey: ["off", "on"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rstrbot
          POSTGRES_PASSWORD: rstrbot_test_only
          POSTGRES_DB: rstrbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rstrbot -d rstrbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Select storage and optional cache
        shell: bash
        run: |
          if [ "${{ matrix.database }}" = postgres ]; then
            echo "RSTRBOT_TEST_DATABASE_URL=postgresql://rstrbot:rstrbot_test_only@127.0.0.1:5432/rstrbot_test" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.valkey }}" = on ]; then
            echo "RSTRBOT_TEST_VALKEY_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
            echo "RSTRBOT_EXPECTED_CACHE_STATE=available" >> "$GITHUB_ENV"
          else
            echo "RSTRBOT_EXPECTED_CACHE_STATE=disabled" >> "$GITHUB_ENV"
          fi
      - run: npm ci && npm run build && npm test
        working-directory: web
      - run: cargo build --workspace --bins --locked
      - run: cargo test --workspace --all-targets --locked
      - run: python3 tests/integration.py --expected-cache-state "$RSTRBOT_EXPECTED_CACHE_STATE" --output test-results/integration.json
      - name: Cache outage preserves database and permission behavior
        if: matrix.valkey == 'off'
        run: python3 tests/integration.py --expected-cache-state degraded --output test-results/integration-degraded-valkey.json
        env:
          RSTRBOT_TEST_VALKEY_URL: redis://127.0.0.1:9
      - name: MCP delivery and restart safety
        shell: bash
        run: python3 tests/plugin_mcp.py | tee test-results/mcp-stdio.json
      - run: python3 tests/delivery_integration.py --output test-results/delivery.json
      - run: python3 tests/delivery_session_revocation.py --output test-results/delivery-session-revocation.json
      - run: python3 tests/shared_context_privacy.py --output test-results/shared-context-privacy.json
      - run: python3 tests/schedule_authority.py --output test-results/schedule-authority.json
      - run: python3 tests/session_revocation.py --output test-results/session-revocation.json
      - run: python3 tests/model_target_authority.py --output test-results/model-target-authority.json
      - run: python3 tests/model_test_revocation.py --output test-results/model-test-revocation.json
      - name: Account configuration, verified email and recovery via real local SMTP
        run: python3 tests/identity_integration.py --output test-results/identity.json
      - name: SQLite streamed fragments survive concurrent writes and restart
        if: matrix.database == 'sqlite' && matrix.valkey == 'off'
        run: python3 tests/stream_persistence.py --output test-results/stream-persistence-sqlite.json
      - name: SQLite conversation history survives restart without truncation
        if: matrix.database == 'sqlite' && matrix.valkey == 'off'
        run: python3 tests/history_recovery.py --output test-results/history-recovery-sqlite.json
      - name: Real SQLite to PostgreSQL and PostgreSQL to SQLite recovery
        if: matrix.database == 'postgres' && matrix.valkey == 'off'
        run: python3 tests/migration_integration.py --output test-results/migration-cross-backend.json
      - name: Prepare an independent Valkey fault-injection process
        if: matrix.database == 'sqlite' && matrix.valkey == 'off'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valkey-tools
          # Ubuntu's packaged Valkey executable selects its entry point by
          # argv[0]. Installing only tools avoids starting a system daemon.
          ln -s "$(command -v valkey-check-rdb)" "$RUNNER_TEMP/valkey-server"
      - name: Cache flush, process loss and recovery never restore revoked access
        if: matrix.database == 'sqlite' && matrix.valkey == 'off'
        run: python3 tests/cache_recovery.py --valkey-server "$RUNNER_TEMP/valkey-server" --valkey-cli "$(command -v valkey-cli)" --output test-results/cache-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.database }}-valkey-${{ matrix.valkey }}
          path: test-results/

  sdk-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"
      - run: cargo build -p rstrbot-plugin --bins --locked
      - run: npm ci && npm run build
        working-directory: sdk/typescript
      - run: dotnet build sdk/csharp/EchoPlugin/EchoPlugin.csproj --configuration Debug
      - name: Run the same vectors through all four real SDK processes
        shell: bash
        run: |
          mkdir -p test-results
          python3 tests/plugin_conformance.py --require-all | tee test-results/sdk-conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-language-sdk-protocol
          path: test-results/

  native-core:
    name: Native core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Locate the runner's Windows OpenSSL development files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # runner-images installs the full x64 distribution in this directory.
          # https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-OpenSSL.ps1
          $rstrbotOpenSsl = Join-Path $env:ProgramFiles 'OpenSSL'
          $rstrbotOpenSslInclude = Join-Path $rstrbotOpenSsl 'include'
          $rstrbotOpenSslLib = Join-Path $rstrbotOpenSsl 'lib\VC\x64\MD'
          $rstrbotOpenSslBin = Join-Path $rstrbotOpenSsl 'bin'
          foreach ($required in @(
            (Join-Path $rstrbotOpenSslInclude 'openssl\ssl.h'),
            (Join-Path $rstrbotOpenSslLib 'libssl.lib'),
            (Join-Path $rstrbotOpenSslLib 'libcrypto.lib'),
            (Join-Path $rstrbotOpenSslBin 'openssl.exe')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "The runner's OpenSSL development file is missing: $required"
            }
          }
          "OPENSSL_INCLUDE_DIR=$rstrbotOpenSslInclude" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$rstrbotOpenSslLib" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=0" >> $env:GITHUB_ENV
          $rstrbotOpenSslBin >> $env:GITHUB_PATH
          # AWS-LC uses these only when NASM is unavailable on Windows x86-64.
          # https://aws.github.io/aws-lc-rs/requirements/windows.html
          "AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV
          & (Join-Path $rstrbotOpenSslBin 'openssl.exe') version
      - name: Locate an installed Homebrew OpenSSL development package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rstrbot_openssl_prefix=""
          for formula in openssl@3 openssl@4; do
            candidate=$(brew --prefix "$formula" 2>/dev/null) || continue
            if [ -f "$candidate/include/openssl/ssl.h" ] &&
               [ -f "$candidate/lib/libssl.dylib" ] &&
               [ -f "$candidate/lib/libcrypto.dylib" ]; then
              rstrbot_openssl_prefix="$candidate"
              break
            fi
          done
          if [ -z "$rstrbot_openssl_prefix" ]; then
            echo 'The runner has no supported Homebrew OpenSSL development package' >&2
            exit 1
          fi
          echo "OPENSSL_INCLUDE_DIR=$rstrbot_openssl_prefix/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$rstrbot_openssl_prefix/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=0" >> "$GITHUB_ENV"
          echo "$rstrbot_openssl_prefix/bin" >> "$GITHUB_PATH"
          "$rstrbot_openssl_prefix/bin/openssl" version
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p rstrbot-store --locked
      # These jobs prove native core/storage behavior only. They do not claim
      # desktop installer, Windows named-pipe, or plugin process acceptance.

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses sources
