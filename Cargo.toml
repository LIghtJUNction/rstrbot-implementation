[workspace]
members = ["crates/rstrbot-store", "crates/rstrbot-plugin"]
resolver = "2"

[package]
name = "rstrbot"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A private, multi-user workspace for conversations, tools and knowledge"
license = "MIT"

[dependencies]
rstrbot-store = { path = "crates/rstrbot-store" }
rstrbot-plugin = { path = "crates/rstrbot-plugin" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chacha20poly1305 = "0.10"
base64 = "0.22"
url = "2"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "workaround-google-passkey-specific-issues"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
openssl = "0.10"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

